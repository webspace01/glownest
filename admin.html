<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GlowNest Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: #fff7fa;
      color: #4d3f45;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #c95f83;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #776a70;
      margin-bottom: 30px;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(120, 80, 100, 0.10);
      margin-bottom: 35px;
    }

    .form-box h2 {
      margin-top: 0;
      color: #c95f83;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 17px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #e3cbd5;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #c95f83;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .required {
      color: #d44d72;
    }

    .image-box {
      margin-top: 10px;
      padding: 15px;
      border: 2px dashed #e3cbd5;
      border-radius: 12px;
      text-align: center;
      background: #fffafb;
    }

    .image-input {
      border: none;
      padding: 5px;
      background: transparent;
    }

    .image-preview {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 15px;
      display: none;
      border: 1px solid #ead5dd;
    }

    .image-note {
      color: #776a70;
      font-size: 13px;
      margin-top: 8px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn {
      background: #c95f83;
      color: white;
      flex: 1;
    }

    .cancel-btn {
      background: #eee1e6;
      color: #5c4d54;
      display: none;
    }

    .product-list-title {
      color: #c95f83;
      margin-bottom: 15px;
    }

    .product-item {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 6px 22px rgba(120, 80, 100, 0.08);
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product-thumb {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      background: #f7edf1;
    }

    .product-details {
      flex: 1;
      min-width: 0;
    }

    .product-details h3 {
      margin: 0 0 6px;
      color: #4d3f45;
    }

    .product-details p {
      margin: 4px 0;
      color: #776a70;
      font-size: 14px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .edit-btn {
      background: #e7a3b9;
      color: white;
    }

    .delete-btn {
      background: #d9536f;
      color: white;
    }

    .empty {
      text-align: center;
      color: #776a70;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .product-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .product-thumb {
        width: 100%;
        height: 220px;
      }

      .product-actions {
        width: 100%;
      }

      .edit-btn,
      .delete-btn {
        flex: 1;
      }

      .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>GlowNest Admin</h1>

  <p class="subtitle">
    Add and manage your GlowNest products
  </p>

  <div id="status" class="status"></div>

  <div class="form-box">

    <h2 id="formTitle">Add New Product</h2>

    <label for="productName">
      Product Name <span class="required">*</span>
    </label>

    <input
      type="text"
      id="productName"
      placeholder="Example: Elegant Press On Nails"
    >

    <label for="category">
      Category <span class="required">*</span>
    </label>

    <select id="category">
      <option value="">Select Category</option>

      <option value="Beauty & Nails">
        Beauty & Nails
      </option>

      <option value="Jewelry & Accessories">
        Jewelry & Accessories
      </option>
    </select>

    <label>
      Product Image <span class="required">*</span>
    </label>

    <div class="image-box">

      <input
        type="file"
        id="imageFile"
        class="image-input"
        accept="image/*"
      >

      <div class="image-note">
        Select an image directly from your phone or computer.
      </div>

      <img
        id="imagePreview"
        class="image-preview"
        alt="Product Image Preview"
      >

    </div>

    <label for="price">
      Price
    </label>

    <input
      type="text"
      id="price"
      placeholder="Optional: $4.99"
    >

    <label for="description">
      Description <span class="required">*</span>
    </label>

    <textarea
      id="description"
      placeholder="Write a short product description..."
    ></textarea>

    <label for="link">
      Main Affiliate Link <span class="required">*</span>
    </label>

    <input
      type="url"
      id="link"
      placeholder="https://example.com/..."
    >

    <label for="pkrLink">
      🇵🇰 PKR Affiliate Link
    </label>

    <input
      type="url"
      id="pkrLink"
      placeholder="Optional PKR affiliate link"
    >

    <label for="usdLink">
      🌎 USD Affiliate Link
    </label>

    <input
      type="url"
      id="usdLink"
      placeholder="Optional USD affiliate link"
    >

    <div class="button-row">

      <button
        class="add-btn"
        id="saveButton"
        onclick="saveProduct()"
      >
        Add Product
      </button>

      <button
        class="cancel-btn"
        id="cancelButton"
        onclick="cancelEdit()"
      >
        Cancel Edit
      </button>

    </div>

  </div>

  <h2 class="product-list-title">
    Your Products
  </h2>

  <div id="productList"></div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {

    apiKey: "AIzaSyDq6u16IpBAUSJwIJ6v8qs9V96S0qB8-20",

    authDomain: "glownest-38e72.firebaseapp.com",

    projectId: "glownest-38e72",

    storageBucket: "glownest-38e72.firebasestorage.app",

    messagingSenderId: "595848542095",

    appId: "1:595848542095:web:65f4571cf96ecd3a787dfa",

    measurementId: "G-W2RYNYT1KR"

  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  let editingId = null;

  let selectedImageData = "";


  /* =========================
     IMAGE SELECT
  ========================= */

  document
    .getElementById("imageFile")
    .addEventListener("change", async function () {

      const file = this.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {

        alert("Please select an image.");

        return;

      }

      try {

        selectedImageData = await compressImage(file);

        const preview =
          document.getElementById("imagePreview");

        preview.src = selectedImageData;

        preview.style.display = "block";

      }

      catch (error) {

        console.error(error);

        alert("Could not process this image.");

      }

    });


  /* =========================
     COMPRESS IMAGE
  ========================= */

  function compressImage(file) {

    return new Promise((resolve, reject) => {

      const reader = new FileReader();

      reader.onload = function (event) {

        const img = new Image();

        img.onload = function () {

          const canvas =
            document.createElement("canvas");

          const maxSize = 700;

          let width = img.width;
          let height = img.height;

          if (width > height) {

            if (width > maxSize) {

              height =
                Math.round(
                  height * maxSize / width
                );

              width = maxSize;

            }

          } else {

            if (height > maxSize) {

              width =
                Math.round(
                  width * maxSize / height
                );

              height = maxSize;

            }

          }

          canvas.width = width;
          canvas.height = height;

          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          const compressed =
            canvas.toDataURL(
              "image/jpeg",
              0.70
            );

          resolve(compressed);

        };

        img.onerror = reject;

        img.src = event.target.result;

      };

      reader.onerror = reject;

      reader.readAsDataURL(file);

    });

  }


  /* =========================
     STATUS
  ========================= */

  function showStatus(message, success = true) {

    const status =
      document.getElementById("status");

    status.textContent = message;

    status.style.color =
      success ? "#c95f83" : "#d9536f";

  }


  /* =========================
     SAVE PRODUCT
  ========================= */

  window.saveProduct = async function () {

    const name =
      document.getElementById("productName")
        .value.trim();

    const category =
      document.getElementById("category")
        .value;

    const price =
      document.getElementById("price")
        .value.trim();

    const description =
      document.getElementById("description")
        .value.trim();

    const link =
      document.getElementById("link")
        .value.trim();

    const pkrLink =
      document.getElementById("pkrLink")
        .value.trim();

    const usdLink =
      document.getElementById("usdLink")
        .value.trim();


    if (
      !name ||
      !category ||
      !selectedImageData ||
      !description ||
      !link
    ) {

      alert(
        "Please fill Product Name, Category, Image, Description and Main Affiliate Link."
      );

      return;

    }


    const productData = {

      name: name,

      category: category,

      image: selectedImageData,

      price: price,

      description: description,

      link: link,

      pkrLink: pkrLink,

      usdLink: usdLink

    };


    try {

      document.getElementById("saveButton")
        .disabled = true;


      /* UPDATE */

      if (editingId) {

        const productRef =
          doc(
            db,
            "products",
            editingId
          );

        await updateDoc(
          productRef,
          productData
        );

        alert(
          "Product updated successfully!"
        );

      }


      /* ADD */

      else {

        await addDoc(
          collection(db, "products"),
          productData
        );

        alert(
          "Product added successfully!"
        );

      }


      resetForm();

      await loadProducts();

    }

    catch (error) {

      console.error(error);

      alert(
        "Firebase error: " +
        error.message
      );

    }

    finally {

      document.getElementById("saveButton")
        .disabled = false;

    }

  };


  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {

    const list =
      document.getElementById("productList");

    list.innerHTML =
      `<div class="empty">
        Loading products...
      </div>`;


    try {

      const snapshot =
        await getDocs(
          collection(db, "products")
        );


      if (snapshot.empty) {

        list.innerHTML =
          `<div class="empty">
            No products added yet.
          </div>`;

        return;

      }


      list.innerHTML = "";


      snapshot.forEach((item) => {

        const product =
          item.data();

        const id =
          item.id;


        const priceHTML =
          product.price
            ? `<p>
                <strong>Price:</strong>
                ${escapeHtml(product.price)}
              </p>`
            : "";


        const productHTML = `

          <div class="product-item">

            <img
              class="product-thumb"
              src="${escapeAttribute(product.image || "")}"
              alt="${escapeAttribute(product.name || "Product")}"
            >

            <div class="product-details">

              <h3>
                ${escapeHtml(
                  product.name ||
                  "Unnamed Product"
                )}
              </h3>

              <p>
                <strong>Category:</strong>
                ${escapeHtml(
                  product.category || ""
                )}
              </p>

              ${priceHTML}

              <div class="product-actions">

                <button
                  class="edit-btn"
                  onclick="editProduct('${id}')"
                >
                  ✏️ Edit
                </button>

                <button
                  class="delete-btn"
                  onclick="deleteProduct('${id}')"
                >
                  🗑️ Delete
                </button>

              </div>

            </div>

          </div>

        `;


        list.innerHTML += productHTML;

      });

    }

    catch (error) {

      console.error(error);

      list.innerHTML =
        `<div class="empty">
          Products could not be loaded.
        </div>`;

    }

  }


  /* =========================
     EDIT PRODUCT
  ========================= */

  window.editProduct = async function (id) {

    try {

      const productRef =
        doc(
          db,
          "products",
          id
        );


      const snapshot =
        await getDocs(
          collection(db, "products")
        );


      let product = null;


      snapshot.forEach((item) => {

        if (item.id === id) {

          product =
            item.data();

        }

      });


      if (!product) {

        alert("Product not found.");

        return;

      }


      editingId = id;


      document.getElementById("productName")
        .value =
        product.name || "";


      document.getElementById("category")
        .value =
        product.category || "";


      document.getElementById("price")
        .value =
        product.price || "";


      document.getElementById("description")
        .value =
        product.description || "";


      document.getElementById("link")
        .value =
        product.link || "";


      document.getElementById("pkrLink")
        .value =
        product.pkrLink || "";


      document.getElementById("usdLink")
        .value =
        product.usdLink || "";


      selectedImageData =
        product.image || "";


      const preview =
        document.getElementById("imagePreview");


      if (selectedImageData) {

        preview.src =
          selectedImageData;

        preview.style.display =
          "block";

      }


      document.getElementById("formTitle")
        .textContent =
        "Edit Product";


      document.getElementById("saveButton")
        .textContent =
        "Update Product";


      document.getElementById("cancelButton")
        .style.display =
        "block";


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }

    catch (error) {

      console.error(error);

      alert(
        "Could not load product: " +
        error.message
      );

    }

  };


  /* =========================
     DELETE PRODUCT
  ========================= */

  window.deleteProduct = async function (id) {

    const confirmDelete =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmDelete) return;


    try {

      await deleteDoc(
        doc(
          db,
          "products",
          id
        )
      );


      alert(
        "Product deleted successfully!"
      );


      await loadProducts();

    }

    catch (error) {

      console.error(error);

      alert(
        "Delete failed: " +
        error.message
      );

    }

  };


  /* =========================
     CANCEL EDIT
  ========================= */

  window.cancelEdit = function () {

    resetForm();

  };


  /* =========================
     RESET FORM
  ========================= */

  function resetForm() {

    editingId = null;

    selectedImageData = "";


    document.getElementById("productName")
      .value = "";


    document.getElementById("category")
      .value = "";


    document.getElementById("imageFile")
      .value = "";


    document.getElementById("price")
      .value = "";


    document.getElementById("description")
      .value = "";


    document.getElementById("link")
      .value = "";


    document.getElementById("pkrLink")
      .value = "";


    document.getElementById("usdLink")
      .value = "";


    const preview =
      document.getElementById("imagePreview");


    preview.src = "";

    preview.style.display =
      "none";


    document.getElementById("formTitle")
      .textContent =
      "Add New Product";


    document.getElementById("saveButton")
      .textContent =
      "Add Product";


    document.getElementById("cancelButton")
      .style.display =
      "none";

  }


  /* =========================
     HTML SAFETY
  ========================= */

  function escapeHtml(text) {

    return String(text)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(text) {

    return escapeHtml(text);

  }


  /* =========================
     START
  ========================= */

  loadProducts();

</script>

</body>
</html>
