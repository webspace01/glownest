<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GlowNest Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #fff7fa;
      color: #4d3f45;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #c95f83;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #776a70;
      margin-bottom: 30px;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(120, 80, 100, 0.10);
      margin-bottom: 35px;
    }

    .form-box h2 {
      margin-top: 0;
      color: #c95f83;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #e3cbd5;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #c95f83;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .required {
      color: #d44d72;
    }

    .image-preview {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
      border: 1px solid #ead5dd;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn {
      background: #c95f83;
      color: white;
      flex: 1;
    }

    .cancel-btn {
      background: #eee1e6;
      color: #5c4d54;
      display: none;
    }

    .product-list-title {
      color: #c95f83;
      margin-bottom: 15px;
    }

    .product-item {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 6px 22px rgba(120, 80, 100, 0.08);
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product-thumb {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      background: #f7edf1;
    }

    .product-details {
      flex: 1;
      min-width: 0;
    }

    .product-details h3 {
      margin: 0 0 6px;
      color: #4d3f45;
    }

    .product-details p {
      margin: 4px 0;
      color: #776a70;
      font-size: 14px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .edit-btn {
      background: #e7a3b9;
      color: white;
    }

    .delete-btn {
      background: #d9536f;
      color: white;
    }

    .empty {
      text-align: center;
      color: #776a70;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    @media (max-width: 600px) {
      .product-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .product-thumb {
        width: 100%;
        height: 200px;
      }

      .product-actions {
        width: 100%;
      }

      .edit-btn,
      .delete-btn {
        flex: 1;
      }

      .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>GlowNest Admin</h1>

    <p class="subtitle">
      Add and manage your GlowNest products
    </p>


    <div class="form-box">

      <h2 id="formTitle">Add New Product</h2>


      <label for="productName">
        Product Name <span class="required">*</span>
      </label>

      <input
        type="text"
        id="productName"
        placeholder="Example: Elegant Press On Nails"
      >


      <label for="category">
        Category <span class="required">*</span>
      </label>

      <select id="category">

        <option value="">
          Select Category
        </option>

        <option value="Beauty & Nails">
          Beauty & Nails
        </option>

        <option value="Jewelry & Accessories">
          Jewelry & Accessories
        </option>

      </select>


      <label for="imageFile">
        Product Image <span class="required">*</span>
      </label>

      <input
        type="file"
        id="imageFile"
        accept="image/*"
        onchange="previewImage(event)"
      >

      <img
        id="imagePreview"
        class="image-preview"
        alt="Product Image Preview"
      >


      <label for="price">
        Price
      </label>

      <input
        type="text"
        id="price"
        placeholder="Example: $4.99"
      >


      <label for="description">
        Description <span class="required">*</span>
      </label>

      <textarea
        id="description"
        placeholder="Write a short product description..."
      ></textarea>


      <label for="link">
        Main AliExpress Affiliate Link <span class="required">*</span>
      </label>

      <input
        type="url"
        id="link"
        placeholder="https://s.click.aliexpress.com/..."
      >


      <label for="pkrLink">
        🇵🇰 PKR Affiliate Link
      </label>

      <input
        type="url"
        id="pkrLink"
        placeholder="https://s.click.aliexpress.com/..."
      >


      <label for="usdLink">
        🌎 USD Affiliate Link
      </label>

      <input
        type="url"
        id="usdLink"
        placeholder="https://s.click.aliexpress.com/..."
      >


      <div class="button-row">

        <button
          class="add-btn"
          id="saveButton"
          onclick="saveProduct()"
        >
          Add Product
        </button>

        <button
          class="cancel-btn"
          id="cancelButton"
          onclick="cancelEdit()"
        >
          Cancel Edit
        </button>

      </div>

    </div>


    <h2 class="product-list-title">
      Your Products
    </h2>

    <div id="productList"></div>

  </div>


<script>

let products = JSON.parse(
  localStorage.getItem("glownestProducts")
) || [];

let selectedImage = "";

let editingId = null;


/* =========================
   IMAGE PREVIEW
========================= */

function previewImage(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    selectedImage = e.target.result;

    const preview =
      document.getElementById("imagePreview");

    preview.src = selectedImage;

    preview.style.display = "block";

  };

  reader.readAsDataURL(file);
}


/* =========================
   SAVE PRODUCT
========================= */

function saveProduct() {

  const name =
    document.getElementById("productName").value.trim();

  const category =
    document.getElementById("category").value;

  const price =
    document.getElementById("price").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const link =
    document.getElementById("link").value.trim();

  const pkrLink =
    document.getElementById("pkrLink").value.trim();

  const usdLink =
    document.getElementById("usdLink").value.trim();


  /* Required fields */

  if (!name || !category || !description || !link) {

    alert(
      "Please fill in Product Name, Category, Description and Main Affiliate Link."
    );

    return;
  }


  /* =========================
     EDIT EXISTING PRODUCT
  ========================= */

  if (editingId !== null) {

    const index = products.findIndex(
      product => product.id === editingId
    );


    if (index !== -1) {

      products[index] = {

        ...products[index],

        name: name,

        category: category,

        price: price,

        description: description,

        link: link,

        pkrLink: pkrLink,

        usdLink: usdLink,

        image:
          selectedImage ||
          products[index].image

      };

    }

    alert("Product updated successfully!");

  }


  /* =========================
     ADD NEW PRODUCT
  ========================= */

  else {

    if (!selectedImage) {

      alert("Please select a product image.");

      return;
    }


    const newProduct = {

      id: Date.now(),

      name: name,

      category: category,

      image: selectedImage,

      price: price,

      description: description,

      link: link,

      pkrLink: pkrLink,

      usdLink: usdLink

    };


    products.push(newProduct);

    alert("Product added successfully!");

  }


  /* Save */

  localStorage.setItem(
    "glownestProducts",
    JSON.stringify(products)
  );


  resetForm();

  renderProducts();

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id) {

  const product = products.find(
    item => item.id === id
  );

  if (!product) return;


  editingId = id;


  document.getElementById("productName").value =
    product.name || "";


  document.getElementById("category").value =
    product.category || "";


  document.getElementById("price").value =
    product.price || "";


  document.getElementById("description").value =
    product.description || "";


  document.getElementById("link").value =
    product.link || "";


  document.getElementById("pkrLink").value =
    product.pkrLink || "";


  document.getElementById("usdLink").value =
    product.usdLink || "";


  selectedImage = "";


  const preview =
    document.getElementById("imagePreview");


  if (product.image) {

    preview.src = product.image;

    preview.style.display = "block";

  }


  document.getElementById("formTitle").textContent =
    "Edit Product";


  document.getElementById("saveButton").textContent =
    "Update Product";


  document.getElementById("cancelButton").style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   DELETE PRODUCT
========================= */

function deleteProduct(id) {

  const product = products.find(
    item => item.id === id
  );

  if (!product) return;


  const confirmDelete = confirm(
    "Are you sure you want to delete this product?"
  );


  if (!confirmDelete) return;


  products = products.filter(
    item => item.id !== id
  );


  localStorage.setItem(
    "glownestProducts",
    JSON.stringify(products)
  );


  if (editingId === id) {

    resetForm();

  }


  renderProducts();

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

  resetForm();

}


/* =========================
   RESET FORM
========================= */

function resetForm() {

  editingId = null;

  selectedImage = "";


  document.getElementById("productName").value = "";

  document.getElementById("category").value = "";

  document.getElementById("price").value = "";

  document.getElementById("description").value = "";

  document.getElementById("link").value = "";

  document.getElementById("pkrLink").value = "";

  document.getElementById("usdLink").value = "";

  document.getElementById("imageFile").value = "";


  const preview =
    document.getElementById("imagePreview");

  preview.src = "";

  preview.style.display = "none";


  document.getElementById("formTitle").textContent =
    "Add New Product";


  document.getElementById("saveButton").textContent =
    "Add Product";


  document.getElementById("cancelButton").style.display =
    "none";

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function renderProducts() {

  const list =
    document.getElementById("productList");


  if (products.length === 0) {

    list.innerHTML = `
      <div class="empty">
        No products added yet.
      </div>
    `;

    return;
  }


  list.innerHTML = products.map(product => `

    <div class="product-item">

      <img
        class="product-thumb"
        src="${product.image || ""}"
        alt="${product.name || "Product"}"
      >


      <div class="product-details">

        <h3>
          ${escapeHtml(product.name || "Unnamed Product")}
        </h3>

        <p>
          <strong>Category:</strong>
          ${escapeHtml(product.category || "")}
        </p>

        ${
          product.price
          ? `
            <p>
              <strong>Price:</strong>
              ${escapeHtml(product.price)}
            </p>
          `
          : ""
        }


        <div class="product-actions">

          <button
            class="edit-btn"
            onclick="editProduct(${product.id})"
          >
            ✏️ Edit
          </button>


          <button
            class="delete-btn"
            onclick="deleteProduct(${product.id})"
          >
            🗑️ Delete
          </button>

        </div>

      </div>

    </div>

  `).join("");

}


/* =========================
   HTML SAFETY
========================= */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   LOAD PRODUCTS
========================= */

renderProducts();

</script>

</body>
</html>
